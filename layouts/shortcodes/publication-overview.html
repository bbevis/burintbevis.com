{{ $image := resources.Get (.Get "image") }}
{{ $preview := $image.Resize "1600x webp q90" }}
<div class="publication-overview">
<div class="publication-description">{{ .Inner | markdownify }}</div>
<figure class="publication-figure">
<a href="{{ $image.RelPermalink }}" target="_blank" rel="noopener" aria-label="View a larger version of the spoken-disagreement results plot">
<img class="nozoom" src="{{ $preview.RelPermalink }}" width="{{ $preview.Width }}" height="{{ $preview.Height }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async">
</a>
</figure>
</div>
