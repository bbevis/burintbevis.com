<script>
  // Identify the current section in both desktop and mobile navigation.
  (() => {
    const path = window.location.pathname.replace(/\/+$/, "") || "/";
    document.querySelectorAll('.main-menu > div a[href]').forEach(link => {
      const url = new URL(link.href, window.location.origin);
      if (url.origin !== window.location.origin) return;
      const target = url.pathname.replace(/\/+$/, "") || "/";
      if (path === target || (target !== "/" && path.startsWith(target + "/"))) {
        link.setAttribute('aria-current', path === target ? 'page' : 'true');
      }
    });
  })();
</script>
